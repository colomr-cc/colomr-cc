sonar.organization=colomr
sonar.projectKey=colomr-cc_colomr-cc
sonar.projectName=colomr-cc

# sources=. keeps YAML workflows under analysis, which is what Automatic
# Analysis covered before the switch. Tests are declared via test.inclusions
# rather than sonar.tests=tests, because sources=. would otherwise index the
# same files twice and abort the scan.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/test_*.py

sonar.exclusions=**/__pycache__/**,.scannerwork/**

# Written by the pytest step that runs immediately before the scan.
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.version=3.12

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: "pip install --only-binary :all: -r requirements-ci.lock"

      - name: Lint
        run: ruff check scripts/ tests/

      - name: Run tests
        run: pytest tests/ -v --cov=scripts --cov-report=xml --cov-fail-under=70

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: No AI attribution (owner authorship)
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          AUTHOR_PATTERN='claude|anthropic|copilot|\[bot\]'
          ATTRIB_PATTERN='co-authored-by:.*(claude|anthropic|copilot)|generated with|generated by|noreply@anthropic|🤖'
          FAIL=0
          RANGE="origin/$BASE_REF..$HEAD_SHA"
          echo "Checking commits in $RANGE"
          if git log "$RANGE" --format='%an <%ae> / %cn <%ce>' | grep -inE "$AUTHOR_PATTERN"; then
            echo "::error::AI author or committer detected in the commits"
            FAIL=1
          fi
          if git log "$RANGE" --format='%B' | grep -inE "$ATTRIB_PATTERN"; then
            echo "::error::AI attribution detected in commit messages"
            FAIL=1
          fi
          if printf '%s\n%s' "$PR_TITLE" "$PR_BODY" | grep -inE "$ATTRIB_PATTERN"; then
            echo "::error::AI attribution detected in the PR title or body"
            FAIL=1
          fi
          exit $FAIL

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install tools
        run: pip install --only-binary ':all:' -r requirements-ci.lock

      - name: Lint Python (ruff)
        run: ruff check scripts/ tests/

      - name: Unit tests (pytest)
        run: pytest tests/ -v --cov=scripts --cov-report=xml --cov-fail-under=70

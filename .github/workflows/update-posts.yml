name: Update README with Latest Posts

"on":
  # Monthly automated update on the 1st of each month at 00:00 UTC
  schedule:
    - cron: '0 0 1 * *'
  # Manual trigger from GitHub UI
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-posts:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: "pip install --only-binary :all: -r requirements.txt"

      - name: Install dev dependencies
        run: "pip install --only-binary :all: -r requirements-dev.txt"

      - name: Lint Python code
        run: ruff check scripts/ tests/

      - name: Run unit tests
        run: pytest tests/ -v --cov=scripts --cov-fail-under=70

      - name: Update README with latest posts
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: python3 scripts/update_posts.py

      - name: Commit and push changes
        run: |
          git config user.name "dev-to-posts[bot]"
          git config user.email "noreply@github.com"
          git add -A
          if ! git diff --quiet --cached; then
            git commit -m "Update README with latest Dev.to posts"
            git push
          fi
